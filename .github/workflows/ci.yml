name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: samjuk/github-actions/.github/workflows/magento2-module.yaml@master
    with:
      run_unit_tests: false
      run_integration_tests: false
